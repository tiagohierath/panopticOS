<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panoptics · Chrome study</title>
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#d8d8d6; }
    body { display:grid; place-items:center; min-height:100svh; padding:24px; }
    .poster { position:relative; width:min(570px,calc(100vw - 48px)); aspect-ratio:2480/3508; overflow:hidden; background:#f04b2a; box-shadow:0 18px 55px #0003; }
    #stage { position:absolute; inset:0; }
    canvas { display:block; width:100%; height:100%; }
    canvas { touch-action:none; cursor:grab; }
    canvas:active { cursor:grabbing; }
    #error { max-width:570px; color:#8a1700; font:14px system-ui; }
  </style>
  <script type="importmap">
    {"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/addons/"}}
  </script>
</head>
<body>
  <main class="poster" aria-label="Beveled chrome Panoptics Eye Center on orange">
    <div id="stage" role="img" aria-label="Chrome Eye Center logo with its original inset star"></div>
  </main>
  <p id="error" hidden></p>
  <script>
    window.addEventListener('error', event => showError(event.message));
    window.addEventListener('unhandledrejection', event => showError(event.reason?.message || String(event.reason)));
    function showError(message) {
      document.documentElement.dataset.renderState = 'error';
      const error = document.querySelector('#error');
      error.textContent = 'The poster could not render: ' + message;
      error.hidden = false;
    }
  </script>
  <script type="module" src="./poster.js?v=beveled-chrome-1"></script>
</body>
</html>
